[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-calibration-replication"
version = "1.0.0"
description = "Replication package for a study of what determines measured calibration in knowledge tracing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "netcal>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]

[tool.setuptools]
packages = ["ktx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
